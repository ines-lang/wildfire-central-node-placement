# events_registry.yaml
# Single list of the events of the thesis: the seven selected events and the dropped alternative, in the order the
# scripts use for their rows (larouco first). Read with wildfire_central_node_placement.registry.
# Edited by hand; every event of the event selection was added on 14 Nov 2026.
# Official names, coordinates, reference times and areas of every candidate stay in the hand-edited ground-truth
# table config/events/candidates_ground_truth.csv (row id = event id here); they are NOT copied here.
# Times are UTC (ISO 8601, Z). Values marked "approximate" or "verify" must not be quoted in the thesis as exact.

schema_version: 4   # v4: every event of the selection (selection: selected | dropped), official perimeter per event,
                    #     conventions.t0 = rule of 13 Nov 2026 (v3: regions; v2: iberia_box)

data_window:
  start_utc: "2025-08-08T00:00:00Z"
  end_utc: "2025-08-16T23:59:00Z"
  firms_data_end_utc: "2025-08-15T21:26:00Z"   # FIRMS has nothing after this
  lsasaf_data_end_utc: "2025-08-16T23:26:00Z"

# Regions: the box every region-level output is cropped to (FIRMS clean / clusters / overpasses,
# GEO export), and the geostationary source used for path B in S0 (kept outside the NeuralAgent simulator).
regions:
  iberia:
    box: {lat_min: 35.0, lat_max: 44.5, lon_min: -10.0, lon_max: 4.0}   # former iberia_box
    geo_source: lsasaf_msg0      # LSA SAF FRP-PIXEL, Meteosat 0 deg (SEVIRI)
  anatolia:                     # added 10 Nov 2026 for silifke (Asia event, confirmed by Ines)
    box: {lat_min: 35.5, lat_max: 37.5, lon_min: 32.5, lon_max: 35.5}
    geo_source: lsasaf_msg0      # LSA SAF FRP-PIXEL, Meteosat 0 deg (SEVIRI); Turkey is inside the MSG disk
  world:
    box: {lat_min: -90.0, lat_max: 90.0, lon_min: -180.0, lon_max: 180.0}
    geo_source: none             # used only for the global event-selection screen (event selection)

conventions:
  # T0 of the thesis (decided 13 Nov 2026; wildfire_central_node_placement.s0.t0_rule, pipeline/4_events/11_t0_rule.py):
  t0: >-
    first robust public satellite detection of the event's main episode: detections of every public source
    (FIRMS VIIRS + MODIS, Sentinel-3 SL_2_FRP, SEVIRI LSA SAF, GOES ABI FDC) inside the official final perimeter
    + 2 km, split into episodes at gaps of at least 12 h; main episode = most detections; robust = polar, or
    geostationary confirmed by the same satellite within 20 min. The official or press time is only compared with T0.
  # superseded on 13 Nov 2026; still computed as t0_utc of the per-event FIRMS summary (regression reference) and by
  # the old Input Comparison step (moved to code-legacy, not run any more):
  t0_until_13nov2026: "first polar baseline (FIRMS VIIRS + MODIS) event-member instant at or after (ignition_utc - ignition_tolerance_min)"
  overpass_window_min: 10
  instant_time_firms: "first event-member detection of the pass"
  instant_time_seviri: "earliest per-pixel acquisition time (ACQTIME) in the 15-min slot"
  seviri_onset_robust: "first of at least 2 consecutive SEVIRI slots with an event-member pixel"
  qc_keep: ["ok", "type_missing"]          # type_missing usable only if static_proxy is False (FIRMS)
  conf_modes: {all: [low, nominal, high], nominal_high: [nominal, high]}
  main_scope: "event_member"               # box-level stats are reported alongside, never as main
  firms_cluster_cell_km: 1.0               # v1 clustering, unchanged so Larouco reproduces
  seviri_membership_primary: "pixel centre inside the bounding box of the FIRMS event cluster"
  seviri_membership_sensitivity_km: 2.0    # pixel centre within this distance of any FIRMS event detection

# Every event:
#   selection   selected (one of the seven events of S0 to S2) | dropped (alternative, appendix only)
#   perimeter   official final burnt area used for the S0 membership and the T0 rule (file in data/raw/effis for
#               source EFFIS, else in data/raw/perimeters)
# Events that went through the per-event input pipelines (FIRMS, LSA SAF, EFFIS) also carry their parameters
# (ignition, reference point, search box, region, regression values).
events:

  larouco:
    selection: selected
    name: "Larouco / A Rua (Ourense, Galicia)"
    status: "v1 done; regression reference"
    ignition_utc: "2025-08-13T16:55:00Z"
    ignition_source: "Xunta de Galicia press note (18:55 local, parish Seadur)"
    ignition_tolerance_min: 0
    region: iberia
    t0_reference: official             # official | geo | none (hierarchy decided 3 Nov 2026; T0 itself: conventions.t0)
    reference_point: {lat: 42.347, lon: -7.162, note: "Larouco village, approximate"}
    seed_radius_km: 5.0
    search_box: {lat_min: 41.9, lat_max: 42.7, lon_min: -7.8, lon_max: -6.6}   # former LAROUCO_BOX
    firms_cluster_id_v1: 15
    effis_ids: [278475]
    official_area_ha: 31778
    official_area_source: "Xunta de Galicia"
    perimeter: {source: EFFIS, effis_id: "278475", file: effis_ba_poly_2025_iberia_morocco.geojson}
    regression_expected:
      firms_event_detections: 646
      t0_utc: "2025-08-13T21:45:00Z"
      t0_platform: "Terra"
      firms_overpasses_with_event: 26
      baseline_gap_median_h: 0.85
      baseline_gap_p90_h: 6.17
      baseline_gap_max_h: 8.60
      first_seviri_event_pixel_utc: "2025-08-13T18:40:00Z"
      effis_start_utc: "2025-08-14T01:34:00Z"
      lsasaf_slots_with_detection_in_search_box: 682

  molezuelas:
    selection: selected
    name: "Molezuelas de la Carballeda (Zamora) / Castrocalbon (Leon)"
    status: "new, v2"
    ignition_utc: "2025-08-10T12:25:00Z"
    ignition_source: "Junta de Castilla y Leon via press: 14:25 local on Sun 10 Aug (another report: about 14:30). Two ignition points near the Tera river were reported. Verify."
    ignition_tolerance_min: 60          # ignition time is approximate; detections up to 60 min earlier are accepted and reported
    region: iberia
    t0_reference: official
    reference_point: {lat: 42.08, lon: -6.18, note: "Molezuelas de la Carballeda village, APPROXIMATE, verify with the FIRMS cluster"}
    seed_radius_km: 10.0
    search_box: {lat_min: 41.75, lat_max: 42.45, lon_min: -6.60, lon_max: -5.70}   # provisional crop, NOT the event
    effis_candidate_ids: [277940]       # Zamora / Una de Quintana, start 2025-08-10 12:32 UTC, 40,081 ha (v1 EFFIS run). To confirm; the Leon part may be separate records.
    official_area_ha: null              # Junta provisional about 31,500 ha (both provinces); media and Copernicus estimates about 37,000 to 38,000 ha. Verify before quoting.
    perimeter: {source: EFFIS, effis_id: "277940", file: effis_ba_poly_2025_iberia_morocco.geojson}
    known_context:
      - "Crossed into Leon on 11 Aug (Valderia, Valduerna, Jamuz; Castrocalbon evacuated 11 Aug evening)."
      - "Neighbouring fires that may merge into a FIRMS cluster: Puercas (Aliste, Zamora, started 11 Aug about 18:30 local), Yeres and Benuza (Leon, further west)."
      - "Still active after the FIRMS data end; reported IGR 0 only about 22 Aug."

  oimbra:                               # Oimbra - A Granxa (Ourense); official time and area: ground-truth table
    selection: selected
    perimeter: {source: EFFIS, effis_id: "278348", file: effis_ba_poly_2025_iberia_morocco.geojson}

  piodao:                               # Piodao (Arganil, Portugal); hour from press citing ANEPC, area official (ICNF)
    selection: selected
    perimeter: {source: EFFIS, effis_id: "278350", file: effis_ba_poly_2025_iberia_morocco.geojson}

  red_canyon:                           # Red Canyon (Wyoming); official discovery time (NIFC WFIGS)
    selection: selected
    perimeter: {source: WFIGS, file: wfigs_red_canyon_2025-WYWBD-000254.geojson}   # WFIGS final perimeter

  mount_underwood:                      # Mount Underwood (British Columbia)
    selection: dropped
    dropped: {date: "2026-11-08", reason: "its official time is the creation of the BC Wildfire Service record, not an observed discovery: out of S1 (alternative for North America, appendix only)"}
    perimeter: {source: BC Wildfire Service, file: bc_mount_underwood_V71498.geojson}   # historical fire polygons

  derdara:                              # Derdara (Chefchaouen, Morocco); hour from press
    selection: selected
    perimeter: {source: EFFIS, effis_id: "278470", file: effis_ba_poly_2025_iberia_morocco.geojson}

  silifke:
    selection: selected
    name: "Silifke (Kirtil / Balandiz, Mersin, Turkey)"
    status: "new, v3 (added 10 Nov 2026; Asia event, confirmed by Ines)"
    ignition_utc: "2025-08-13T09:45:00Z"
    ignition_source: "Press (TRT Haber, DHA): about 12:45 local (UTC+3) on 13 Aug, three ignition points; cause under trial (welding). Hour NOT official."
    ignition_tolerance_min: 60
    region: anatolia
    t0_reference: geo                  # hour in press only (as Piodao, Derdara): T0 reference = first SEVIRI detection
    reference_point: {lat: 36.30, lon: 33.76, note: "FIRMS cluster 81 centre (event-selection screen)"}
    seed_radius_km: 10.0
    search_box: {lat_min: 36.10, lat_max: 36.50, lon_min: 33.55, lon_max: 34.00}
    firms_cluster_id_world: 81
    effis_ids: [278368]                # Mersin, 6,202 ha; FIREDATE 2025-08-12 22:37 UTC does not match any vegetation detection (first one 13 Aug 09:52 UTC, NOAA-20)
    official_area_ha: 6115
    official_area_source: "Mersin Orman Bolge Mudurlugu via press (Jul 2026): 6,115 ha, Kirtil and Cadirli sites together"
    perimeter: {source: EFFIS, effis_id: "278368", file: effis_ba_poly_2025_silifke.geojson}
    known_context:
      - "A static industrial hot spot (36.264, 33.729) inside the EFFIS perimeter is detected every night; FIRMS flags it non-vegetation."
      - "Controlled on 16 Aug 2025."
